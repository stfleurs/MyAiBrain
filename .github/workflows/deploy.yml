name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ${{ vars.GCR_LOCATION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCR_REPOSITORY }}/pam-mcp:${{ github.sha }}

jobs:
  deploy-mcp:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ vars.GCR_LOCATION }}-docker.pkg.dev

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/mcp-server/Dockerfile
          push: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ vars.CLOUD_RUN_SERVICE }}
          region: ${{ vars.CLOUD_RUN_REGION }}
          image: ${{ env.IMAGE }}
          # Public HTTPS; the app enforces MCP_AUTH_TOKEN (Bearer) itself.
          # max-instances=1 keeps in-memory MCP sessions sticky.
          flags: --allow-unauthenticated --max-instances=1 --cpu=1 --memory=512Mi
          env_vars: |
            MCP_TRANSPORT=http
            SUPABASE_URL=${{ secrets.SUPABASE_URL }}
            EMBEDDING_MODEL=text-embedding-3-small
            MCP_USER_ID=${{ secrets.MCP_USER_ID }}
          secrets: |
            SUPABASE_SERVICE_ROLE_KEY=${{ vars.GSM_SERVICE_ROLE_KEY }}:latest
            MCP_AUTH_TOKEN=${{ vars.GSM_MCP_AUTH_TOKEN }}:latest
            OPENAI_API_KEY=${{ vars.GSM_OPENAI_API_KEY }}:latest

  deploy-web:
    runs-on: ubuntu-latest
    if: ${{ secrets.VERCEL_TOKEN != '' && github.event_name == 'workflow_dispatch' }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Deploy to Vercel (production)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npx vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx vercel build --prod --token="$VERCEL_TOKEN"
          npx vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
