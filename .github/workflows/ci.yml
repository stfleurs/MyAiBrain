name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      # Secret values are present only so the bundle scan below can catch leaks.
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      MCP_AUTH_TOKEN: ${{ secrets.MCP_AUTH_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests (shared)
        run: pnpm --filter @pam/shared test

      - name: Unit tests (mcp-server)
        run: pnpm --filter @pam/mcp-server test

      - name: Build web
        run: pnpm --filter @pam/web build

      # Runs after the build so bundle-secrets.test.ts scans a real bundle.
      - name: Unit tests (web) incl. bundle-secret regression
        run: pnpm --filter @pam/web test

      - name: Verify secrets absent from client bundle
        run: pnpm --filter @pam/web check:secrets

      - name: Build-test MCP server image
        run: docker build -f apps/mcp-server/Dockerfile -t pam-mcp:ci .
